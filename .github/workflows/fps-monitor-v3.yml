          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setBackgroundColor(0xFF000000);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              public class Bridge {
                  @JavascriptInterface
                  public void start() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (!Settings.canDrawOverlays(MainActivity.this)) {
                                  Intent p = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                          Uri.parse("package:" + getPackageName()));
                                  startActivity(p);
                                  return;
                              }
                              Intent i = new Intent(MainActivity.this, OverlayService.class);
                              if (Build.VERSION.SDK_INT >= 26) {
                                  startForegroundService(i);
                              } else {
                                  startService(i);
                              }
                              moveTaskToBack(true);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String shizuku() {
                      try {
                          if (!Shizuku.pingBinder()) {
                              return "Shizuku is not running. Open the Shizuku app and start it.";
                          }
                          if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                              return "Shizuku access is on.";
                          }
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Shizuku.requestPermission(1);
                                  } catch (Throwable t) {
                                      // ignore
                                  }
                              }
                          });
                          return "Tap Allow in the Shizuku popup.";
                      } catch (Throwable t) {
                          return "Shizuku is not available.";
                      }
                  }

                  @JavascriptInterface
                  public void stop() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              stopService(new Intent(MainActivity.this, OverlayService.class));
                          }
                      });
                  }
              }
          }
