          package com.max.fpsmonitor;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class OverlayService extends Service {
              private WindowManager wm;
              private WebView web;
              private WindowManager.LayoutParams lp;
              private Thread worker;
              private volatile boolean running;
              private Stats stats;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "stop".equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  Notification.Builder nb;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("ov", "Overlay", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                      nb = new Notification.Builder(this, "ov");
                  } else {
                      nb = new Notification.Builder(this);
                  }
                  Intent st = new Intent(this, OverlayService.class).setAction("stop");
                  PendingIntent pi = PendingIntent.getService(this, 0, st,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = nb.setContentTitle("FPS Monitor overlay is on")
                          .setContentText("Tap this notification to stop it")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(pi)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1, n);
                  }
                  if (web == null) {
                      show();
                      startStats();
                  }
                  return START_NOT_STICKY;
              }

              private void show() {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  final float d = getResources().getDisplayMetrics().density;
                  final int sw = getResources().getDisplayMetrics().widthPixels;
                  final float asp = 0.5f;
                  int w = (int) (340 * d);
                  int type = Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
                  lp = new WindowManager.LayoutParams(w, (int) (w * asp), type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                                  | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = (int) (10 * d);
                  lp.y = (int) (60 * d);
                  web = new WebView(this);
                  web.setBackgroundColor(0);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.loadUrl("file:///android_asset/index.html?overlay=1");
                  final ScaleGestureDetector sg = new ScaleGestureDetector(this,
                          new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                              @Override
                              public boolean onScale(ScaleGestureDetector g) {
                                  int nw = Math.round(lp.width * g.getScaleFactor());
                                  nw = Math.max((int) (140 * d), Math.min(nw, sw));
                                  lp.width = nw;
                                  lp.height = Math.round(nw * asp);
                                  wm.updateViewLayout(web, lp);
                                  return true;
                              }
                          });
                  web.setOnTouchListener(new View.OnTouchListener() {
                      float sx, sy;
                      int ox, oy;
                      boolean rb = true;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          sg.onTouchEvent(e);
                          if (e.getPointerCount() > 1 || sg.isInProgress()) {
                              rb = true;
                              return true;
                          }
                          if (e.getActionMasked() == MotionEvent.ACTION_DOWN || rb) {
                              sx = e.getRawX();
                              sy = e.getRawY();
                              ox = lp.x;
                              oy = lp.y;
                              rb = false;
                              return true;
                          }
                          if (e.getActionMasked() == MotionEvent.ACTION_MOVE) {
                              lp.x = ox + Math.round(e.getRawX() - sx);
                              lp.y = oy + Math.round(e.getRawY() - sy);
                              wm.updateViewLayout(web, lp);
                          }
                          return true;
                      }
                  });
                  wm.addView(web, lp);
              }

              private void startStats() {
                  stats = new Stats(this);
                  running = true;
                  worker = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          while (running) {
                              try {
                                  final String js = "window.setStats&&setStats(" + stats.poll() + ")";
                                  final WebView w = web;
                                  if (w != null) {
                                      w.post(new Runnable() {
                                          @Override
                                          public void run() {
                                              w.evaluateJavascript(js, null);
                                          }
                                      });
                                  }
                              } catch (Throwable t) {
                                  // ignore and retry
                              }
                              try {
                                  Thread.sleep(1000);
                              } catch (InterruptedException e) {
                                  return;
                              }
                          }
                      }
                  });
                  worker.start();
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (worker != null) {
                      worker.interrupt();
                  }
                  if (web != null && wm != null) {
                      wm.removeView(web);
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
