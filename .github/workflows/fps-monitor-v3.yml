          package com.max.fpsmonitor;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.os.BatteryManager;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          import rikka.shizuku.Shizuku;

          class Stats {
              private final Context ctx;
              private long lastTotal = -1;
              private long lastIdle = -1;
              private long lastTs = 0;
              private String layer = "";
              private long layerAt = 0;

              Stats(Context c) {
                  ctx = c;
              }

              static boolean ready() {
                  try {
                      return Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              static String sh(String cmd) {
                  try {
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      Process p = (Process) m.invoke(null, new Object[]{new String[]{"sh", "-c", cmd}, null, null});
                      InputStream in = p.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                      }
                      p.waitFor();
                      return bo.toString("UTF-8");
                  } catch (Throwable t) {
                      return null;
                  }
              }

              static String rd(String path) {
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(new FileInputStream(path)))) {
                      return r.readLine();
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private static void put(StringBuilder j, String k, Double v) {
                  j.append('"').append(k).append("\":");
                  if (v == null || v.isNaN() || v.isInfinite()) {
                      j.append("null");
                  } else {
                      j.append(String.format(Locale.US, "%.1f", v));
                  }
                  j.append(',');
              }

              String poll() {
                  StringBuilder j = new StringBuilder("{");
                  boolean priv = ready();
                  j.append("\"sh\":").append(priv ? 1 : 0).append(',');

                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  ((ActivityManager) ctx.getSystemService(Context.ACTIVITY_SERVICE)).getMemoryInfo(mi);
                  put(j, "ru", (mi.totalMem - mi.availMem) / 1048576.0);

                  double volt = 0;
                  Intent bi = ctx.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  if (bi != null) {
                      put(j, "bt", bi.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10.0);
                      volt = bi.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) / 1000.0;
                      int lv = bi.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int sc = bi.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                      if (lv >= 0 && sc > 0) {
                          put(j, "bl", 100.0 * lv / sc);
                      }
                  }
                  BatteryManager bm = (BatteryManager) ctx.getSystemService(Context.BATTERY_SERVICE);
                  double amp = Math.abs((double) bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW));
                  if (amp > 0 && amp < 20000) {
                      amp *= 1000;
                  }
                  put(j, "bw", (volt > 0 && amp > 0) ? amp / 1e6 * volt : null);

                  Double cu = null, cc = null, ct = null, gu = null, gc = null, gt = null, fps = null;
                  List<Double> fts = new ArrayList<Double>();

                  if (priv) {
                      try {
                          long now = System.currentTimeMillis();
                          boolean det = now - layerAt > 5000;
                          if (det) {
                              layerAt = now;
                          }
                          String script = "L='" + layer.replace("'", "") + "'\n"
                                  + "echo @@cpu; head -n 1 /proc/stat\n"
                                  + "echo @@freq; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq 2>/dev/null\n"
                                  + "echo @@gpu\n"
                                  + "for f in /sys/class/kgsl/kgsl-3d0/gpubusy /sys/class/kgsl/kgsl-3d0/gpuclk /sys/class/kgsl/kgsl-3d0/devfreq/cur_freq /sys/class/devfreq/*gpu*/cur_freq /sys/class/devfreq/*mali*/cur_freq /sys/class/devfreq/*gpu*/load /sys/devices/platform/*mali*/utilization /sys/kernel/ged/hal/gpu_utilization; do [ -r \"$f\" ] && echo \"$f=$(cat \"$f\" 2>/dev/null)\"; done\n"
                                  + "echo @@temp\n"
                                  + "for z in /sys/class/thermal/thermal_zone*; do echo \"$(cat $z/type 2>/dev/null)=$(cat $z/temp 2>/dev/null)\"; done\n"
                                  + "echo @@fps\n"
                                  + "[ -n \"$L\" ] && dumpsys SurfaceFlinger --latency \"$L\" 2>/dev/null\n"
                                  + (det ? "echo @@focus\ndumpsys window 2>/dev/null | grep -m 1 mCurrentFocus\necho @@layers\ndumpsys SurfaceFlinger --list 2>/dev/null\n" : "");
                          String out = sh(script);
                          if (out != null) {
                              Map<String, List<String>> sec = new HashMap<String, List<String>>();
                              String name = "";
                              for (String ln : out.split("\n")) {
                                  if (ln.startsWith("@@")) {
                                      name = ln.substring(2).trim();
                                      sec.put(name, new ArrayList<String>());
                                  } else if (sec.containsKey(name)) {
                                      sec.get(name).add(ln);
                                  }
                              }

                              List<String> cp = sec.get("cpu");
                              if (cp != null && !cp.isEmpty()) {
                                  String[] t = cp.get(0).trim().split("\\s+");
                                  if (t.length >= 8) {
                                      long tot = 0;
                                      for (int i = 1; i < Math.min(t.length, 9); i++) {
                                          tot += Long.parseLong(t[i]);
                                      }
                                      long idle = Long.parseLong(t[4]) + Long.parseLong(t[5]);
                                      if (lastTotal >= 0 && tot > lastTotal) {
                                          cu = 100.0 * ((tot - lastTotal) - (idle - lastIdle)) / (tot - lastTotal);
                                      }
                                      lastTotal = tot;
                                      lastIdle = idle;
                                  }
                              }

                              List<String> fq = sec.get("freq");
                              if (fq != null) {
                                  double mx = 0;
                                  for (String s : fq) {
                                      try {
                                          mx = Math.max(mx, Double.parseDouble(s.trim()));
                                      } catch (Exception e) {
                                          // skip
                                      }
                                  }
                                  if (mx > 0) {
                                      cc = mx / 1000.0;
                                  }
                              }

                              List<String> gp = sec.get("gpu");
                              if (gp != null) {
                                  for (String s : gp) {
                                      int eq = s.indexOf('=');
                                      if (eq < 0) {
                                          continue;
                                      }
                                      String key = s.substring(0, eq);
                                      String val = s.substring(eq + 1).trim();
                                      String[] nn = val.split("[ @]+");
                                      try {
                                          if (key.endsWith("gpubusy") && nn.length >= 2) {
                                              double total = Double.parseDouble(nn[1]);
                                              if (total > 0) {
                                                  gu = 100.0 * Double.parseDouble(nn[0]) / total;
                                              }
                                          } else if (key.endsWith("gpuclk") || key.endsWith("cur_freq")) {
                                              double f = Double.parseDouble(nn[0]);
                                              gc = f > 1e6 ? f / 1e6 : (f > 1e3 ? f / 1e3 : f);
                                          } else if (key.endsWith("/load") || key.endsWith("utilization")) {
                                              double u = Double.parseDouble(nn[0]);
                                              if (u >= 0 && u <= 100) {
                                                  gu = u;
                                              }
                                          }
                                      } catch (Exception e) {
                                          // skip
                                      }
                                  }
                              }

                              List<String> tz = sec.get("temp");
                              if (tz != null) {
                                  double cm = -1;
                                  double gm = -1;
                                  for (String s : tz) {
                                      int eq = s.indexOf('=');
                                      if (eq < 0) {
                                          continue;
                                      }
                                      String ty = s.substring(0, eq).toLowerCase(Locale.US);
                                      try {
                                          double tv = Double.parseDouble(s.substring(eq + 1).trim());
                                          if (tv > 1000) {
                                              tv /= 1000;
                                          }
                                          if (tv < 10 || tv > 125) {
                                              continue;
                                          }
                                          if (ty.contains("cpu")) {
                                              cm = Math.max(cm, tv);
                                          }
                                          if (ty.contains("gpu")) {
                                              gm = Math.max(gm, tv);
                                          }
                                      } catch (Exception e) {
                                          // skip
                                      }
                                  }
                                  if (cm > 0) {
                                      ct = cm;
                                  }
                                  if (gm > 0) {
                                      gt = gm;
                                  }
                              }

                              List<String> fo = sec.get("focus");
                              List<String> ly = sec.get("layers");
                              if (det && fo != null && !fo.isEmpty()) {
                                  Matcher mt = Pattern.compile("\\s([A-Za-z0-9_.]+)/").matcher(fo.get(0));
                                  String pkg = mt.find() ? mt.group(1) : "";
                                  String best = "";
                                  if (!pkg.isEmpty() && !pkg.equals(ctx.getPackageName()) && ly != null) {
                                      for (String s : ly) {
                                          if (!s.contains(pkg)) {
                                              continue;
                                          }
                                          String tr = s.trim();
                                          if (best.isEmpty() || (tr.contains("SurfaceView") && !best.contains("SurfaceView"))) {
                                              best = tr;
                                          }
                                      }
                                  }
                                  layer = best;
                              }

                              List<String> fl = sec.get("fps");
                              if (fl != null && fl.size() > 2 && !layer.isEmpty()) {
                                  List<Long> ts = new ArrayList<Long>();
                                  for (int i = 1; i < fl.size(); i++) {
                                      String[] pp = fl.get(i).trim().split("\\s+");
                                      if (pp.length < 3) {
                                          continue;
                                      }
                                      long v = Long.parseLong(pp[1]);
                                      if (v > 0 && v < Long.MAX_VALUE) {
                                          ts.add(v);
                                      }
                                  }
                                  if (ts.size() > 2) {
                                      long last = ts.get(ts.size() - 1);
                                      for (int i = 1; i < ts.size(); i++) {
                                          if (ts.get(i) > lastTs) {
                                              fts.add((ts.get(i) - ts.get(i - 1)) / 1e6);
                                          }
                                      }
                                      long first = last;
                                      int cnt = 0;
                                      for (long v : ts) {
                                          if (v >= last - 1000000000L) {
                                              if (cnt == 0) {
                                                  first = v;
                                              }
                                              cnt++;
                                          }
                                      }
                                      if (cnt >= 2 && last > first) {
                                          fps = (cnt - 1) * 1e9 / (last - first);
                                      }
                                      if (System.nanoTime() - last > 3000000000L) {
                                          fps = null;
                                      }
                                      lastTs = last;
                                  }
                              }
                          }
                      } catch (Throwable t) {
                          // keep whatever was read
                      }
                  }

                  if (cc == null) {
                      double mx = 0;
                      for (int i = 0; i < 16; i++) {
                          String s = rd("/sys/devices/system/cpu/cpu" + i + "/cpufreq/scaling_cur_freq");
                          if (s == null) {
                              continue;
                          }
                          try {
                              mx = Math.max(mx, Double.parseDouble(s.trim()));
                          } catch (Exception e) {
                              // skip
                          }
                      }
                      if (mx > 0) {
                          cc = mx / 1000.0;
                      }
                  }

                  put(j, "cu", cu);
                  put(j, "cc", cc);
                  put(j, "ct", ct);
                  put(j, "gu", gu);
                  put(j, "gc", gc);
                  put(j, "gt", gt);
                  put(j, "fps", fps);
                  j.append("\"ft\":[");
                  for (int i = 0; i < fts.size(); i++) {
                      if (i > 0) {
                          j.append(',');
                      }
                      j.append(String.format(Locale.US, "%.2f", fts.get(i)));
                  }
                  j.append("]}");
                  return j.toString();
              }
          }
